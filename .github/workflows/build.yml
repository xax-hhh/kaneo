name: Build and Push Kaneo

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  HARBOR_REGISTRY: harbor.k8s.local:32078
  HARBOR_PROJECT: myapp
  IMAGE_NAME: kaneo

jobs:
  build-and-push:
    runs-on: kaneo-runners
    steps:
      - name: Setup Git Proxy
        run: |
          git config --global http.proxy http://192.168.31.115:7890
          git config --global https.proxy http://192.168.31.115:7890

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Short SHA
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          echo "🎯 Kaneo Image Tag: $SHORT_SHA"

      - name: Setup Harbor Cert
        run: |
          mkdir -p $HOME/.docker/certs.d/${{ env.HARBOR_REGISTRY }}
          cp /tmp/harbor-ca/ca.crt $HOME/.docker/certs.d/${{ env.HARBOR_REGISTRY }}/ca.crt

      - name: Login to Harbor
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASS: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          echo "$HARBOR_PASS" | docker login ${{ env.HARBOR_REGISTRY }} -u "$HARBOR_USER" --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE_FULL=${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:${{ env.SHORT_SHA }}
          # 这里指定了官方写的 Dockerfile.kaneo
          docker build --memory="1500m" --build-arg NODE_OPTIONS="--max-old-space-size=1024" -f Dockerfile.kaneo -t $IMAGE_FULL .
          docker push $IMAGE_FULL
          echo "✅ Pushed image: $IMAGE_FULL"